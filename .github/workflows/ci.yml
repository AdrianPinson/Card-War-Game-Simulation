name: War validation
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: war-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B clean verify
      - run: python scripts/smoke_cli.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: war-test-results-${{ runner.os }}
          path: target/surefire-reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: war-core-jar
          path: target/war-simulation.jar
          retention-days: 7

  desktop:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install desktop test dependencies
        timeout-minutes: 3
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6
      - name: Exercise real JavaFX controls and worker tasks
        run: xvfb-run -a -s '-screen 0 1600x1200x24' mvn -B -Pui-tests clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: war-desktop-results
          path: |
            target/failsafe-reports/
            target/ui-screenshots/
          retention-days: 7
