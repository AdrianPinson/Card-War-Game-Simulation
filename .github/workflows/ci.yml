name: War core
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: war-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B clean verify
      - run: python scripts/smoke_cli.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: war-test-results-${{ runner.os }}
          path: target/surefire-reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: war-core-jar
          path: target/war-simulation.jar
          retention-days: 7
